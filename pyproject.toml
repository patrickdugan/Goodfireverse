[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goodfireverse"
version = "0.1.0"
description = "Resumable public-source research corpus for Goodfire"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12", "truststore>=0.10", "pypdf>=5"]

[project.optional-dependencies]
media = ["yt-dlp>=2025.1", "faster-whisper>=1.2.1,<1.3", "av>=11,<19"]
cuda-windows = ["nvidia-cublas-cu12>=12.8", "nvidia-cudnn-cu12>=9"]

[project.scripts]
goodfireverse = "goodfireverse.cli:main"

[tool.setuptools.packages.find]
where = ["pipelines"]
